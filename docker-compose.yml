services:
  db:
    image: postgres:16
    container_name: stockquest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockquest_user
      POSTGRES_PASSWORD: stockquest_pass
      POSTGRES_DB: stockquest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: